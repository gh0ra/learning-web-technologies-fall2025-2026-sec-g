<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="historyStyle.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Recovered Items</title>
  </head>
  <body>
    <header>
      <div>
        <img src="logo.png" alt="Logo" />
        <span>Things for u</span>
      </div>
      <nav>
        <a href="">Home</a>
        <a href="">Lost Items</a>
        <a href="">Found Items</a>
      </nav>
      <div>
        <img src="icon.png" alt="UserIcon" />
        <button>Log Out</button>
      </div>
    </header>

    <main>
      <h1>My Recovered Items</h1>
      <p>User Email</p>
      <p>Username</p>

      <div>
        <span>Table View</span>
      </div>

      <table border="1">
        <thead>
          <tr>
            <th>Location</th>
            <th>Recovered By</th>
            <th>Recovery Date</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>...</td>
            <td>...</td>
            <td>...</td>
            <td>...</td>
          </tr>
        </tbody>
      </table>
    </main>
  </body>
</html>
