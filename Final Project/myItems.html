<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="myItemStyle.css" />
    <title>My Items</title>
  </head>
  <body>
    <header>
      <div>
        <img src="logo.png" alt="Logo" />
        <span>Where is it?</span>
      </div>
      <nav>
        <a href="">Home</a>
        <a href="">Lost & Found Items</a>
      </nav>
      <div>
        <img src="user-icon.png" alt="User" />
        <button>Log Out</button>
      </div>
    </header>

    <main>
      <h1>My Items</h1>
      <div class="user-info">
        <p>User Email</p>
        <p>Username</p>
      </div>

      <table>
        <thead>
          <tr>
            <th>Thumbnails</th>
            <th>Title</th>
            <th>Category</th>
            <th>Status</th>
            <th>Location</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>
              <img src="x.png" alt="itemPic" />
              <p>Item description</p>
            </td>
          </tr>
        </tbody>
      </table>
    </main>
  </body>
</html>
